<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getFirestore, collection, doc, getDocs, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAY-ZGwYfqWbTRI7BL6xGp87SxiGt15OU8",
  authDomain: "casa-creativa-6a1c1.firebaseapp.com",
  projectId: "casa-creativa-6a1c1",
  storageBucket: "casa-creativa-6a1c1.firebasestorage.app",
  messagingSenderId: "874227781556",
  appId: "1:874227781556:web:ceaf624a509bce0f4d2ce1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const COL = "centro_control_items";

window.__fbReady = (async () => {
  return {
    async getAll() {
      const snap = await getDocs(collection(db, COL));
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    },
    async setItem(item) {
      await setDoc(doc(db, COL, item.id), item);
    },
    async deleteItem(id) {
      await deleteDoc(doc(db, COL, id));
    },
  };
})();
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

const Settings = (p) => <Icon {...p}><circle cx="12" cy="12" r="3" /><path d="M19 12 H21 M3 12 H5 M12 3 V5 M12 19 V21 M17.5 6.5 L19 5 M5 19 L6.5 17.5 M17.5 17.5 L19 19 M5 5 L6.5 6.5" /></Icon>;
const Download = (p) => <Icon {...p}><path d="M12 3 V15" /><path d="M7 10 L12 15 L17 10" /><path d="M4 19 H20" /></Icon>;

/* ------------------------------------------------------------------ */
/* Tokens                                                              */
/* ------------------------------------------------------------------ */
const INK = "#232A2E";
const PAPER = "#F5F2EA";
const PAPER_DIM = "#EDE9DE";
const LINE = "#DCD6C6";

const CATS = {
  pago:       { label: "Pago",        short: "Pagos",       icon: "💳", color: "#B8763B", soft: "#F3E3D2" },
  cita:       { label: "Cita",        short: "Citas",       icon: "📅", color: "#2E7D75", soft: "#DCEFEC" },
  documento:  { label: "Documento",   short: "Documentos",  icon: "📄", color: "#6C4E85", soft: "#E7DEEE" },
  renovacion: { label: "Renovación",  short: "Renovaciones",icon: "🔄", color: "#A8492F", soft: "#F1DCD4" },
  viaje:      { label: "Viaje",       short: "Viajes",      icon: "✈️", color: "#2F6690", soft: "#DCE8F0" },
  pendiente:  { label: "Pendiente",   short: "Pendientes",  icon: "✅", color: "#4E7A45", soft: "#E1EBDC" },
};
const CAT_ORDER = ["pago", "cita", "documento", "renovacion", "viaje", "pendiente"];

const REMINDER_PRESETS = [
  { label: "6 meses antes", days: 182 },
  { label: "3 meses antes", days: 91 },
  { label: "1 mes antes", days: 30 },
  { label: "1 semana antes", days: 7 },
  { label: "5 días antes", days: 5 },
  { label: "1 día antes", days: 1 },
];

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const todayISO = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};
const fmtLong = (iso) =>
  iso ? new Date(iso + "T00:00:00").toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" }) : "";
const fmtShort = (iso) =>
  iso ? new Date(iso + "T00:00:00").toLocaleDateString("es-MX", { day: "numeric", month: "short" }) : "";
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
const addMonths = (iso, n) => {
  const d = new Date(iso + "T00:00:00");
  d.setMonth(d.getMonth() + n);
  return d.toISOString().slice(0, 10);
};
const money = (n) => (n === "" || n === undefined || n === null ? "" : Number(n).toLocaleString("es-MX", { style: "currency", currency: "MXN" }));

/* ------------------------------------------------------------------ */
/* Storage (Firebase, sincroniza entre dispositivos)                   */
/* ------------------------------------------------------------------ */
function useItems() {
  const [items, setItems] = useState(null); // null = cargando
  const [error, setError] = useState(false);
  const [fb, setFb] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const api = await window.__fbReady;
        setFb(api);
        const all = await api.getAll();
        setItems(all);
      } catch (e) {
        setError(true);
        setItems([]);
      }
    })();
  }, []);

  const persist = useCallback(async (next) => {
    const prev = items || [];
    setItems(next);
    if (!fb) { setError(true); return; }
    try {
      const prevIds = new Set(prev.map((i) => i.id));
      const nextIds = new Set(next.map((i) => i.id));
      const toDelete = prev.filter((i) => !nextIds.has(i.id));
      const toSave = next.filter((i) => {
        const old = prev.find((p) => p.id === i.id);
        return !old || JSON.stringify(old) !== JSON.stringify(i);
      });
      await Promise.all([
        ...toDelete.map((i) => fb.deleteItem(i.id)),
        ...toSave.map((i) => fb.setItem(i)),
      ]);
    } catch {
      setError(true);
    }
  }, [items, fb]);

  return { items, persist, error };
}

/* ------------------------------------------------------------------ */
/* Small UI atoms                                                      */
/* ------------------------------------------------------------------ */
function Pill({ children, color, soft }) {
  return (
    <span
      className="text-[11px] font-medium px-2 py-0.5 rounded-full"
      style={{ background: soft, color }}
    >
      {children}
    </span>
  );
}

function IconBtn({ onClick, children, label }) {
  return (
    <button
      onClick={onClick}
      aria-label={label}
      className="w-9 h-9 flex items-center justify-center rounded-full active:scale-95 transition"
      style={{ color: INK }}
    >
      {children}
    </button>
  );
}

function EmptyState({ icon, text }) {
  return (
    <div className="flex flex-col items-center justify-center text-center py-16 opacity-60">
      <div className="text-4xl mb-2">{icon}</div>
      <p className="text-sm" style={{ color: INK }}>{text}</p>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Item card                                                           */
/* ------------------------------------------------------------------ */
function statusLabel(it) {
  if (it.category === "documento" || it.category === "renovacion") return null;
  if (it.status === "completado") return it.category === "pago" ? "Pagado" : it.category === "cita" ? "Realizada" : "Hecho";
  if (it.status === "cancelada") return "Cancelada";
  return null;
}

function relativeTag(iso) {
  const d = daysBetween(todayISO(), iso);
  if (d < 0) return { text: `Atrasado ${Math.abs(d)}d`, tone: "bad" };
  if (d === 0) return { text: "Hoy", tone: "warn" };
  if (d === 1) return { text: "Mañana", tone: "warn" };
  if (d <= 7) return { text: `En ${d} días`, tone: "soon" };
  return { text: fmtShort(iso), tone: "later" };
}

function ItemCard({ item, onOpen }) {
  const cat = CATS[item.category];
  const done = item.status === "completado" || item.status === "cancelada";
  const tag = relativeTag(item.date);
  const toneColor = { bad: "#B23A2E", warn: "#B8763B", soon: "#2E7D75", later: "#8A8578" }[tag.tone];

  return (
    <button
      onClick={() => onOpen(item)}
      className="w-full text-left rounded-2xl p-3.5 flex items-start gap-3 active:scale-[0.99] transition"
      style={{ background: "white", border: `1px solid ${LINE}`, opacity: done ? 0.55 : 1 }}
    >
      <div
        className="w-10 h-10 rounded-xl flex items-center justify-center text-lg shrink-0"
        style={{ background: cat.soft }}
      >
        {cat.icon}
      </div>
      <div className="min-w-0 flex-1">
        <div className="flex items-center justify-between gap-2">
          <p className="font-semibold text-[15px] truncate" style={{ color: INK, fontFamily: "'Fraunces', serif" }}>
            {item.title || cat.label}
          </p>
          {!done && (
            <span className="text-[11px] font-semibold shrink-0" style={{ color: toneColor }}>
              {tag.text}
            </span>
          )}
        </div>
        <div className="flex flex-wrap items-center gap-1.5 mt-1">
          {item.endDate && item.endDate !== item.date && (
            <span className="text-xs" style={{ color: "#8A8578" }}>
              {fmtShort(item.date)} – {fmtShort(item.endDate)}
            </span>
          )}
          {item.time && <span className="text-xs" style={{ color: "#8A8578" }}>{item.time}</span>}
          {item.place && <span className="text-xs truncate" style={{ color: "#8A8578" }}>· {item.place}</span>}
          {item.amount !== "" && item.amount !== undefined && item.category === "pago" && (
            <span className="text-xs font-medium" style={{ color: cat.color }}>{money(item.amount)}</span>
          )}
          {statusLabel(item) && <Pill color={cat.color} soft={cat.soft}>{statusLabel(item)}</Pill>}
          {item.recurringMonths > 0 && <span className="text-xs" style={{ color: "#8A8578" }}><RotateCcw size={10} className="inline -mt-0.5" /></span>}
        </div>
      </div>
    </button>
  );
}

/* ------------------------------------------------------------------ */
/* Item Form (add/edit)                                                */
/* ------------------------------------------------------------------ */
function ItemForm({ initial, defaultCategory, prefillDate, onSave, onDelete, onClose }) {
  const [category, setCategory] = useState(initial?.category || defaultCategory || "pendiente");
  const [title, setTitle] = useState(initial?.title || "");
  const [date, setDate] = useState(initial?.date || prefillDate || todayISO());
  const [endDate, setEndDate] = useState(initial?.endDate || "");
  const [time, setTime] = useState(initial?.time || "");
  const [place, setPlace] = useState(initial?.place || "");
  const [amount, setAmount] = useState(initial?.amount ?? "");
  const [account, setAccount] = useState(initial?.account || "");
  const [destino, setDestino] = useState(initial?.destino || "");
  const [notes, setNotes] = useState(initial?.notes || "");
  const [recurringMonths, setRecurringMonths] = useState(initial?.recurringMonths || 0);
  const [reminders, setReminders] = useState(initial?.reminders || (category === "documento" || category === "renovacion" ? [30] : []));
  const [status, setStatus] = useState(initial?.status || "pendiente");

  const cat = CATS[category];
  const isDateSpan = category === "viaje" || category === "pendiente";
  const isDoc = category === "documento" || category === "renovacion";

  const toggleReminder = (d) => {
    setReminders((r) => (r.includes(d) ? r.filter((x) => x !== d) : [...r, d].sort((a, b) => b - a)));
  };

  const save = () => {
    if (!title.trim() || !date) return;
    const item = {
      id: initial?.id || uid(),
      category,
      title: title.trim(),
      date,
      endDate: endDate || "",
      time: time || "",
      place: place.trim(),
      amount: category === "pago" ? amount : "",
      account: account.trim(),
      destino: destino.trim(),
      notes: notes.trim(),
      recurringMonths: category === "pago" ? Number(recurringMonths) || 0 : 0,
      reminders,
      status,
      history: initial?.history || [],
    };
    onSave(item);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center" style={{ background: "rgba(35,42,46,0.45)" }} onClick={onClose}>
      <div
        className="w-full sm:max-w-md max-h-[90vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-5"
        style={{ background: PAPER }}
        onClick={(e) => e.stopPropagation()}
      >
        <div className="flex items-center justify-between mb-4">
          <h2 className="text-lg font-semibold" style={{ fontFamily: "'Fraunces', serif", color: INK }}>
            {initial ? "Editar" : "Nuevo"}
          </h2>
          <IconBtn onClick={onClose} label="Cerrar"><X size={20} /></IconBtn>
        </div>

        {!initial && (
          <div className="flex flex-wrap gap-2 mb-4">
            {CAT_ORDER.map((c) => (
              <button
                key={c}
                onClick={() => setCategory(c)}
                className="px-3 py-1.5 rounded-full text-sm font-medium flex items-center gap-1.5 transition"
                style={{
                  background: category === c ? CATS[c].color : "white",
                  color: category === c ? "white" : INK,
                  border: `1px solid ${category === c ? CATS[c].color : LINE}`,
                }}
              >
                <span>{CATS[c].icon}</span>{CATS[c].label}
              </button>
            ))}
          </div>
        )}

        <div className="space-y-3">
          <div>
            <label className="text-xs font-medium" style={{ color: "#8A8578" }}>Título</label>
            <input
              value={title}
              onChange={(e) => setTitle(e.target.value)}
              placeholder={category === "viaje" ? "Ej. Viaje a Oaxaca" : category === "pago" ? "Ej. Tarjeta BBVA" : "Título"}
              className="w-full mt-1 px-3 py-2.5 rounded-xl text-[15px] outline-none"
              style={{ background: "white", border: `1px solid ${LINE}`, color: INK }}
            />
          </div>

          {category === "viaje" && (
            <div>
              <label className="text-xs font-medium" style={{ color: "#8A8578" }}>Destino</label>
              <input value={destino} onChange={(e) => setDestino(e.target.value)} className="w-full mt-1 px-3 py-2.5 rounded-xl text-[15px] outline-none" style={{ background: "white", border: `1px solid ${LINE}`, color: INK }} />
            </div>
          )}

          <div className="flex gap-3">
            <div className="flex-1">
              <label className="text-xs font-medium" style={{ color: "#8A8578" }}>
                {isDoc ? "Fecha de vencimiento" : isDateSpan ? "Fecha inicio" : "Fecha"}
              </label>
              <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="w-full mt-1 px-3 py-2.5 rounded-xl text-[15px] outline-none" style={{ background: "white", border: `1px solid ${LINE}`, color: INK }} />
            </div>
            {isDateSpan && (
              <div className="flex-1">
                <label className="text-xs font-medium" style={{ color: "#8A8578" }}>Fecha fin (opcional)</label>
                <input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} className="w-full mt-1 px-3 py-2.5 rounded-xl text-[15px] outline-none" style={{ background: "white", border: `1px solid ${LINE}`, color: INK }} />
              </div>
            )}
            {category === "cita" && (
              <div className="flex-1">
                <label className="text-xs font-medium" style={{ color: "#8A8578" }}>Hora</label>
                <input type="time" value={time} onChange={(e) => setTime(e.target.value)} className="w-full mt-1 px-3 py-2.5 rounded-xl text-[15px] outline-none" style={{ background: "white", border: `1px solid ${LINE}`, color: INK }} />
              </div>
            )}
          </div>

          {category === "cita" && (
            <div>
              <label className="text-xs font-medium" style={{ color: "#8A8578" }}>Lugar</label>
              <input value={place} onChange={(e) => setPlace(e.target.value)} className="w-full mt-1 px-3 py-2.5 rounded-xl text-[15px] outline-none" style={{ background: "white", border: `1px solid ${LINE}`, color: INK }} />
            </div>
          )}

          {category === "pago" && (
            <>
              <div className="flex gap-3">
                <div className="flex-1">
                  <label className="text-xs font-medium" style={{ color: "#8A8578" }}>Monto</label>
                  <input type="number" inputMode="decimal" value={amount} onChange={(e) => setAmount(e.target.value)} className="w-full mt-1 px-3 py-2.5 rounded-xl text-[15px] outline-none" style={{ background: "white", border: `1px solid ${LINE}`, color: INK }} />
                </div>
                <div className="flex-1">
                  <label className="text-xs font-medium" style={{ color: "#8A8578" }}>Cuenta / tarjeta</label>
                  <input value={account} onChange={(e) => setAccount(e.target.value)} placeholder="Desde dónde pagas" className="w-full mt-1 px-3 py-2.5 rounded-xl text-[15px] outline-none" style={{ background: "white", border: `1px solid ${LINE}`, color: INK }} />
                </div>
              </div>
              <div>
                <label className="text-xs font-medium" style={{ color: "#8A8578" }}>Recurrencia</label>
                <div className="flex gap-2 mt-1">
                  {[{ v: 0, t: "Único" }, { v: 1, t: "Mensual" }, { v: 3, t: "Trimestral" }, { v: 12, t: "Anual" }].map((o) => (
                    <button key={o.v} onClick={() => setRecurringMonths(o.v)} className="px-3 py-1.5 rounded-full text-xs font-medium"
                      style={{ background: recurringMonths === o.v ? INK : "white", color: recurringMonths === o.v ? PAPER : INK, border: `1px solid ${LINE}` }}>
                      {o.t}
                    </button>
                  ))}
                </div>
              </div>
            </>
          )}

          {isDoc && (
            <div>
              <label className="text-xs font-medium" style={{ color: "#8A8578" }}>Recordatorios</label>
              <div className="flex flex-wrap gap-2 mt-1">
                {REMINDER_PRESETS.map((r) => (
                  <button key={r.days} onClick={() => toggleReminder(r.days)} className="px-2.5 py-1 rounded-full text-xs font-medium"
                    style={{ background: reminders.includes(r.days) ? cat.color : "white", color: reminders.includes(r.days) ? "white" : INK, border: `1px solid ${LINE}` }}>
                    {r.label}
                  </button>
                ))}
              </div>
            </div>
          )}

          {!isDoc && (
            <div>
              <label className="text-xs font-medium" style={{ color: "#8A8578" }}>Estado</label>
              <div className="flex gap-2 mt-1">
                {["pendiente", "completado", ...(category === "cita" ? ["cancelada"] : [])].map((s) => (
                  <button key={s} onClick={() => setStatus(s)} className="px-3 py-1.5 rounded-full text-xs font-medium capitalize"
                    style={{ background: status === s ? cat.color : "white", color: status === s ? "white" : INK, border: `1px solid ${LINE}` }}>
                    {s === "completado" ? (category === "pago" ? "Pagado" : category === "cita" ? "Realizada" : "Hecho") : s}
                  </button>
                ))}
              </div>
            </div>
          )}

          <div>
            <label className="text-xs font-medium" style={{ color: "#8A8578" }}>Notas</label>
            <textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows={2} className="w-full mt-1 px-3 py-2.5 rounded-xl text-[15px] outline-none resize-none" style={{ background: "white", border: `1px solid ${LINE}`, color: INK }} />
          </div>
        </div>

        <div className="flex gap-2 mt-5">
          {initial && (
            <button onClick={() => onDelete(initial.id)} className="w-11 h-11 rounded-xl flex items-center justify-center" style={{ background: "white", border: `1px solid ${LINE}`, color: "#B23A2E" }}>
              <Trash2 size={18} />
            </button>
          )}
          <button onClick={save} disabled={!title.trim() || !date} className="flex-1 py-3 rounded-xl font-semibold text-[15px] disabled:opacity-40" style={{ background: INK, color: PAPER }}>
            Guardar
          </button>
        </div>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Renew Document modal                                                */
/* ------------------------------------------------------------------ */
function RenewModal({ item, onConfirm, onClose }) {
  const [newDate, setNewDate] = useState(addMonths(item.date, 12));
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center px-6" style={{ background: "rgba(35,42,46,0.45)" }} onClick={onClose}>
      <div className="w-full max-w-sm rounded-2xl p-5" style={{ background: PAPER }} onClick={(e) => e.stopPropagation()}>
        <h3 className="font-semibold text-[16px] mb-1" style={{ fontFamily: "'Fraunces', serif", color: INK }}>Renovar {item.title}</h3>
        <p className="text-xs mb-3" style={{ color: "#8A8578" }}>El vencimiento anterior ({fmtLong(item.date)}) se guardará en el historial.</p>
        <label className="text-xs font-medium" style={{ color: "#8A8578" }}>Nueva fecha de vencimiento</label>
        <input type="date" value={newDate} onChange={(e) => setNewDate(e.target.value)} className="w-full mt-1 px-3 py-2.5 rounded-xl text-[15px] outline-none" style={{ background: "white", border: `1px solid ${LINE}`, color: INK }} />
        <div className="flex gap-2 mt-4">
          <button onClick={onClose} className="flex-1 py-2.5 rounded-xl font-medium text-sm" style={{ border: `1px solid ${LINE}`, color: INK }}>Cancelar</button>
          <button onClick={() => onConfirm(newDate)} className="flex-1 py-2.5 rounded-xl font-semibold text-sm" style={{ background: INK, color: PAPER }}>Confirmar</button>
        </div>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Settings / Backup                                                   */
/* ------------------------------------------------------------------ */
function SettingsModal({ items, onClose, onImport }) {
  const [msg, setMsg] = useState("");

  const exportData = () => {
    const blob = new Blob([JSON.stringify(items, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `centro-de-control-respaldo-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    setMsg("Respaldo descargado ✓");
  };

  const importData = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!Array.isArray(parsed)) throw new Error("bad");
        onImport(parsed);
        setMsg("Datos restaurados ✓");
      } catch {
        setMsg("Ese archivo no se pudo leer. ¿Es un respaldo válido?");
      }
    };
    reader.readAsText(file);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center" style={{ background: "rgba(35,42,46,0.45)" }} onClick={onClose}>
      <div className="w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-5" style={{ background: PAPER }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-1">
          <h2 className="text-lg font-semibold" style={{ fontFamily: "'Fraunces', serif", color: INK }}>Respaldo de datos</h2>
          <IconBtn onClick={onClose} label="Cerrar"><X size={20} /></IconBtn>
        </div>
        <p className="text-sm mb-4" style={{ color: "#8A8578" }}>
          Tus {items.length} elementos se guardan en la nube y se sincronizan automáticamente entre tu laptop y tu celular. Descarga un respaldo de vez en cuando por si acaso.
        </p>

        <button onClick={exportData} className="w-full py-3 rounded-xl font-semibold text-[15px] flex items-center justify-center gap-2 mb-3" style={{ background: INK, color: PAPER }}>
          <Download size={17} /> Descargar respaldo (.json)
        </button>

        <label className="w-full py-3 rounded-xl font-medium text-[15px] flex items-center justify-center gap-2 cursor-pointer" style={{ background: "white", border: `1px solid ${LINE}`, color: INK }}>
          <Upload size={17} /> Restaurar desde un archivo
          <input type="file" accept="application/json" onChange={importData} className="hidden" />
        </label>

        {msg && <p className="text-xs text-center mt-3" style={{ color: msg.includes("✓") ? "#4E7A45" : "#B23A2E" }}>{msg}</p>}

        <p className="text-xs mt-5 opacity-60" style={{ color: INK }}>
          Restaurar reemplaza todo lo que tienes ahora por lo que traiga el archivo. Úsalo solo si perdiste información.
        </p>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Home / Hoy                                                          */
/* ------------------------------------------------------------------ */
function HomeView({ items, onOpen, onSettings }) {
  const today = todayISO();
  const groups = useMemo(() => {
    const hoy = [], semana = [], pronto = [];
    for (const it of items) {
      if (it.status === "completado" || it.status === "cancelada") continue;
      const d = daysBetween(today, it.date);
      if (d <= 0) hoy.push(it);
      else if (d <= 7) semana.push(it);
      else if (d <= 45) pronto.push(it);
    }
    const byDate = (a, b) => a.date.localeCompare(b.date);
    return { hoy: hoy.sort(byDate), semana: semana.sort(byDate), pronto: pronto.sort(byDate) };
  }, [items, today]);

  const Section = ({ title, list }) =>
    list.length > 0 && (
      <div className="mb-6">
        <h3 className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color: "#8A8578" }}>{title}</h3>
        <div className="space-y-2">
          {list.map((it) => <ItemCard key={it.id} item={it} onOpen={onOpen} />)}
        </div>
      </div>
    );

  const nothing = groups.hoy.length + groups.semana.length + groups.pronto.length === 0;

  return (
    <div className="px-4 pt-2 pb-24">
      <div className="mb-5 pt-2 flex items-start justify-between">
        <div>
          <p className="text-xs" style={{ color: "#8A8578" }}>{new Date().toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" })}</p>
          <h1 className="text-2xl font-semibold" style={{ fontFamily: "'Fraunces', serif", color: INK }}>Hoy</h1>
        </div>
        <IconBtn onClick={onSettings} label="Respaldo de datos"><Settings size={20} /></IconBtn>
      </div>
      {nothing ? (
        <EmptyState icon="🌤️" text="Nada urgente por ahora. Todo bajo control." />
      ) : (
        <>
          <Section title="Hoy y atrasado" list={groups.hoy} />
          <Section title="Próximos 7 días" list={groups.semana} />
          <Section title="Próximamente" list={groups.pronto} />
        </>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Category List View                                                  */
/* ------------------------------------------------------------------ */
function ListView({ category, items, onOpen }) {
  const cat = CATS[category];
  const list = useMemo(() => {
    const filtered = items.filter((i) => i.category === category);
    return filtered.sort((a, b) => a.date.localeCompare(b.date));
  }, [items, category]);

  const pending = list.filter((i) => i.status !== "completado" && i.status !== "cancelada");
  const done = list.filter((i) => i.status === "completado" || i.status === "cancelada");

  return (
    <div className="px-4 pt-2 pb-24">
      <div className="mb-5 pt-2 flex items-center gap-2">
        <span className="text-2xl">{cat.icon}</span>
        <h1 className="text-2xl font-semibold" style={{ fontFamily: "'Fraunces', serif", color: INK }}>{cat.short}</h1>
      </div>
      {list.length === 0 ? (
        <EmptyState icon={cat.icon} text={`Aún no tienes ${cat.short.toLowerCase()}.`} />
      ) : (
        <div className="space-y-2">
          {pending.map((it) => <ItemCard key={it.id} item={it} onOpen={onOpen} />)}
          {done.length > 0 && (
            <>
              <h3 className="text-xs font-semibold uppercase tracking-wide mt-5 mb-2" style={{ color: "#8A8578" }}>Historial</h3>
              {done.map((it) => <ItemCard key={it.id} item={it} onOpen={onOpen} />)}
            </>
          )}
        </div>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Calendar View                                                       */
/* ------------------------------------------------------------------ */
function CalendarView({ items, onOpen, onAddOnDay }) {
  const [cursor, setCursor] = useState(() => { const d = new Date(); d.setDate(1); return d; });
  const [selected, setSelected] = useState(todayISO());

  const year = cursor.getFullYear(), month = cursor.getMonth();
  const firstDow = (new Date(year, month, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const dayMap = useMemo(() => {
    const m = {};
    for (const it of items) {
      const start = it.date;
      const end = it.endDate || it.date;
      if (end >= start) {
        let cur = start;
        let guard = 0;
        while (cur <= end && guard < 60) {
          (m[cur] ||= []).push(it);
          cur = new Date(new Date(cur + "T00:00:00").getTime() + 86400000).toISOString().slice(0, 10);
          guard++;
        }
      }
    }
    return m;
  }, [items]);

  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const iso = (d) => `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  const monthLabel = cursor.toLocaleDateString("es-MX", { month: "long", year: "numeric" });
  const dayItems = (dayMap[selected] || []).sort((a, b) => (a.time || "").localeCompare(b.time || ""));

  return (
    <div className="px-4 pt-2 pb-24">
      <div className="flex items-center justify-between pt-2 mb-4">
        <h1 className="text-2xl font-semibold capitalize" style={{ fontFamily: "'Fraunces', serif", color: INK }}>{monthLabel}</h1>
        <div className="flex gap-1">
          <IconBtn label="Mes anterior" onClick={() => setCursor(new Date(year, month - 1, 1))}><ChevronLeft size={18} /></IconBtn>
          <IconBtn label="Mes siguiente" onClick={() => setCursor(new Date(year, month + 1, 1))}><ChevronRight size={18} /></IconBtn>
        </div>
      </div>

      <div className="grid grid-cols-7 text-center mb-1">
        {["L", "M", "X", "J", "V", "S", "D"].map((d) => (
          <div key={d} className="text-[11px] font-medium py-1" style={{ color: "#8A8578" }}>{d}</div>
        ))}
      </div>
      <div className="grid grid-cols-7 gap-y-1">
        {cells.map((d, idx) => {
          if (d === null) return <div key={idx} />;
          const dISO = iso(d);
          const dayList = dayMap[dISO] || [];
          const isToday = dISO === todayISO();
          const isSelected = dISO === selected;
          const cats = [...new Set(dayList.map((i) => i.category))].slice(0, 4);
          return (
            <button key={idx} onClick={() => setSelected(dISO)} className="flex flex-col items-center py-1.5 gap-1 rounded-xl"
              style={{ background: isSelected ? INK : "transparent" }}>
              <span className="text-[13px] font-medium w-6 h-6 flex items-center justify-center rounded-full"
                style={{ color: isSelected ? PAPER : isToday ? CATS.cita.color : INK, border: isToday && !isSelected ? `1px solid ${CATS.cita.color}` : "none" }}>
                {d}
              </span>
              <div className="flex gap-0.5 h-1.5">
                {cats.map((c) => (
                  <span key={c} className="w-1 h-1 rounded-full" style={{ background: isSelected ? PAPER : CATS[c].color }} />
                ))}
              </div>
            </button>
          );
        })}
      </div>

      <div className="mt-6">
        <div className="flex items-center justify-between mb-2">
          <h3 className="text-sm font-semibold" style={{ color: INK }}>{fmtLong(selected)}</h3>
          <button onClick={() => onAddOnDay(selected)} className="text-xs font-medium flex items-center gap-1" style={{ color: CATS.cita.color }}>
            <Plus size={14} /> Agregar
          </button>
        </div>
        {dayItems.length === 0 ? (
          <p className="text-sm py-6 text-center opacity-50" style={{ color: INK }}>Sin nada este día.</p>
        ) : (
          <div className="space-y-2">
            {dayItems.map((it) => <ItemCard key={it.id + selected} item={it} onOpen={onOpen} />)}
          </div>
        )}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* App                                                                  */
/* ------------------------------------------------------------------ */
const TABS = [
  { key: "hoy", label: "Hoy", icon: Home },
  { key: "calendario", label: "Calendario", icon: CalendarIconEl },
  { key: "pago", label: "Pagos", icon: CreditCard },
  { key: "cita", label: "Citas", icon: Stethoscope },
  { key: "documento", label: "Docs", icon: FileText },
  { key: "viaje", label: "Viajes", icon: Plane },
];

function App() {
  const { items, persist, error } = useItems();
  const [tab, setTab] = useState("hoy");
  const [formState, setFormState] = useState(null);
  const [renewing, setRenewing] = useState(null);
  const [detail, setDetail] = useState(null);
  const [showSettings, setShowSettings] = useState(false);

  const openDetail = (item) => setDetail(item);
  const openNew = (defaultCategory, date) => setFormState({ initial: date ? { date } : null, defaultCategory });

  const saveItem = async (item) => {
    if (!items) return;
    const exists = items.some((i) => i.id === item.id);
    const next = exists ? items.map((i) => (i.id === item.id ? item : i)) : [...items, item];
    await persist(next);
    setFormState(null);
    setDetail(null);
  };

  const deleteItem = async (id) => {
    await persist(items.filter((i) => i.id !== id));
    setFormState(null);
    setDetail(null);
  };

  const toggleStatus = async (item) => {
    const isDone = item.status === "completado";
    let next = items.map((i) => (i.id === item.id ? { ...i, status: isDone ? "pendiente" : "completado" } : i));
    if (!isDone && item.category === "pago" && item.recurringMonths > 0) {
      next = [...next, { ...item, id: uid(), status: "pendiente", date: addMonths(item.date, item.recurringMonths) }];
    }
    await persist(next);
    setDetail((d) => (d ? { ...d, status: isDone ? "pendiente" : "completado" } : d));
  };

  const renewDoc = async (item, newDate) => {
    const history = [...(item.history || []), { date: item.date, renewedOn: todayISO() }];
    const next = items.map((i) => (i.id === item.id ? { ...i, date: newDate, history } : i));
    await persist(next);
    setRenewing(null);
    setDetail(null);
  };

  if (items === null) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ background: PAPER }}>
        <p className="text-sm" style={{ color: "#8A8578" }}>Cargando…</p>
      </div>
    );
  }

  return (
    <div className="min-h-screen w-full flex justify-center" style={{ background: PAPER_DIM, fontFamily: "'Inter', sans-serif" }}>
      <div className="w-full max-w-md min-h-screen relative" style={{ background: PAPER }}>
        {error && (
          <div className="text-[11px] text-center py-1" style={{ background: "#F1DCD4", color: "#A8492F" }}>
            No se pudo guardar. Revisa tu conexión.
          </div>
        )}

        {tab === "hoy" && <HomeView items={items} onOpen={openDetail} onSettings={() => setShowSettings(true)} />}
        {tab === "calendario" && <CalendarView items={items} onOpen={openDetail} onAddOnDay={(date) => openNew("pendiente", date)} />}
        {["pago", "cita", "documento", "viaje"].includes(tab) && (
          <ListView category={tab} items={items} onOpen={openDetail} />
        )}

        <button
          onClick={() => openNew(tab === "hoy" || tab === "calendario" ? "pendiente" : tab)}
          style={{
            position: "fixed",
            bottom: "5.5rem",
            right: "max(1.25rem, calc(50vw - 14rem))",
            background: INK, color: PAPER,
            width: 52, height: 52, borderRadius: 26,
            display: "flex", alignItems: "center", justifyContent: "center",
            boxShadow: "0 6px 16px rgba(35,42,46,0.25)",
            zIndex: 30,
          }}
          aria-label="Agregar"
        >
          <Plus size={24} />
        </button>

        <div className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md flex border-t" style={{ background: PAPER, borderColor: LINE }}>
          {TABS.map((t) => {
            const IconComp = t.icon;
            const activeCat = CATS[t.key];
            const active = tab === t.key;
            return (
              <button key={t.key} onClick={() => setTab(t.key)} className="flex-1 flex flex-col items-center gap-0.5 py-2.5">
                <IconComp size={20} color={active ? (activeCat ? activeCat.color : INK) : "#B8B2A0"} strokeWidth={active ? 2.4 : 2} />
                <span className="text-[10px] font-medium" style={{ color: active ? INK : "#B8B2A0" }}>{t.label}</span>
              </button>
            );
          })}
        </div>

        {detail && (
          <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center" style={{ background: "rgba(35,42,46,0.45)" }} onClick={() => setDetail(null)}>
            <div className="w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-5" style={{ background: PAPER }} onClick={(e) => e.stopPropagation()}>
              <div className="flex items-start justify-between mb-3">
                <div className="flex items-center gap-2">
                  <span className="text-xl">{CATS[detail.category].icon}</span>
                  <h2 className="text-lg font-semibold" style={{ fontFamily: "'Fraunces', serif", color: INK }}>{detail.title}</h2>
                </div>
                <IconBtn onClick={() => setDetail(null)} label="Cerrar"><X size={20} /></IconBtn>
              </div>
              <div className="space-y-1.5 text-sm mb-4" style={{ color: INK }}>
                <p><Clock size={13} className="inline mr-1.5 -mt-0.5" />{fmtLong(detail.date)}{detail.time ? ` · ${detail.time}` : ""}</p>
                {detail.endDate && detail.endDate !== detail.date && <p>Hasta {fmtLong(detail.endDate)}</p>}
                {detail.place && <p>📍 {detail.place}</p>}
                {detail.destino && <p>Destino: {detail.destino}</p>}
                {detail.amount !== "" && detail.category === "pago" && <p>Monto: {money(detail.amount)}</p>}
                {detail.account && <p>Cuenta: {detail.account}</p>}
                {detail.notes && <p className="opacity-70">{detail.notes}</p>}
                {detail.history && detail.history.length > 0 && (
                  <p className="text-xs opacity-60">Historial: {detail.history.map((h) => fmtShort(h.date)).join(", ")}</p>
                )}
              </div>
              <div className="flex gap-2">
                {(detail.category === "documento" || detail.category === "renovacion") ? (
                  <button onClick={() => setRenewing(detail)} className="flex-1 py-2.5 rounded-xl font-semibold text-sm flex items-center justify-center gap-1.5" style={{ background: CATS[detail.category].color, color: "white" }}>
                    <RotateCcw size={15} /> Renovar
                  </button>
                ) : (
                  <button onClick={() => toggleStatus(detail)} className="flex-1 py-2.5 rounded-xl font-semibold text-sm flex items-center justify-center gap-1.5"
                    style={{ background: detail.status === "completado" ? "white" : CATS[detail.category].color, color: detail.status === "completado" ? INK : "white", border: detail.status === "completado" ? `1px solid ${LINE}` : "none" }}>
                    <Check size={15} /> {detail.status === "completado" ? "Marcar pendiente" : "Marcar hecho"}
                  </button>
                )}
                <button onClick={() => setFormState({ initial: detail })} className="w-11 h-11 rounded-xl flex items-center justify-center" style={{ background: "white", border: `1px solid ${LINE}`, color: INK }}>
                  <Pencil size={16} />
                </button>
                <button onClick={() => deleteItem(detail.id)} className="w-11 h-11 rounded-xl flex items-center justify-center" style={{ background: "white", border: `1px solid ${LINE}`, color: "#B23A2E" }}>
                  <Trash2 size={16} />
                </button>
              </div>
            </div>
          </div>
        )}

        {formState && (
          <ItemForm
            initial={formState.initial && formState.initial.id ? formState.initial : null}
            defaultCategory={formState.defaultCategory || (formState.initial && formState.initial.date ? undefined : "pendiente")}
            prefillDate={formState.initial && !formState.initial.id ? formState.initial.date : undefined}
            onSave={saveItem}
            onDelete={deleteItem}
            onClose={() => setFormState(null)}
          />
        )}

        {renewing && <RenewModal item={renewing} onConfirm={(d) => renewDoc(renewing, d)} onClose={() => setRenewing(null)} />}

        {showSettings && (
          <SettingsModal
            items={items}
            onClose={() => setShowSettings(false)}
            onImport={async (data) => { await persist(data); }}
          />
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
